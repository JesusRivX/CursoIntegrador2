<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2180" width="1000" height="2180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="h2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1000" height="2180" fill="#f8fafc"/>

  <!-- ENCABEZADO -->
  <rect x="0" y="0" width="1000" height="170" fill="url(#h2)"/>
  <text x="500" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#99f6e4" letter-spacing="3">PRODUCTO LIBRE · SESIÓN 02</text>
  <text x="500" y="102" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff">SCRUM Y LAS HISTORIAS DE USUARIO</text>
  <text x="500" y="134" text-anchor="middle" font-size="17" fill="#ccfbf1">Los elementos del marco de trabajo aplicados a ESTUD-IA</text>

  <!-- 1. POR QUÉ ÁGIL -->
  <circle cx="58" cy="230" r="15" fill="#0d9488"/>
  <text x="58" y="236" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1</text>
  <text x="86" y="237" font-size="24" font-weight="800" fill="#0f172a">¿Qué es Scrum y para qué sirve?</text>

  <rect x="40" y="258" width="920" height="80" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="64" y="290" font-size="15" fill="#134e4a">Marco de trabajo ágil para desarrollar productos complejos de forma incremental. No es una receta rígida:</text>
  <text x="64" y="316" font-size="15" fill="#134e4a">facilita la entrega continua de valor y la adaptación rápida al cambio mediante comunicación y transparencia.</text>

  <rect x="40" y="356" width="296" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="188" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">Entrega continua</text>
  <text x="188" y="414" text-anchor="middle" font-size="13" fill="#475569">Valor utilizable en cada</text>
  <text x="188" y="433" text-anchor="middle" font-size="13" fill="#475569">iteración, no al final</text>

  <rect x="352" y="356" width="296" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">Adaptación al cambio</text>
  <text x="500" y="414" text-anchor="middle" font-size="13" fill="#475569">Los requisitos pueden</text>
  <text x="500" y="433" text-anchor="middle" font-size="13" fill="#475569">evolucionar sin romper el plan</text>

  <rect x="664" y="356" width="296" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="812" y="388" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">Transparencia</text>
  <text x="812" y="414" text-anchor="middle" font-size="13" fill="#475569">El avance es visible para</text>
  <text x="812" y="433" text-anchor="middle" font-size="13" fill="#475569">todo el equipo</text>

  <!-- 2. HISTORIA DE USUARIO -->
  <circle cx="58" cy="514" r="15" fill="#0d9488"/>
  <text x="58" y="520" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2</text>
  <text x="86" y="521" font-size="24" font-weight="800" fill="#0f172a">¿Qué es una historia de usuario?</text>

  <rect x="40" y="542" width="920" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="64" y="574" font-size="15" fill="#334155">Una manera simple de describir una tarea concisa que aporta valor al usuario o al negocio. Nacen de la</text>
  <text x="64" y="600" font-size="15" fill="#334155">conversación con los stakeholders y son, ante todo, una invitación a seguir conversando.</text>

  <!-- LAS 3 C -->
  <text x="86" y="668" font-size="19" font-weight="800" fill="#0f172a">Las tres partes de una historia</text>

  <rect x="40" y="686" width="298" height="188" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="40" y="686" width="298" height="46" rx="12" fill="#0d9488"/>
  <rect x="40" y="714" width="298" height="18" fill="#0d9488"/>
  <text x="189" y="716" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">TARJETA</text>
  <text x="66" y="762" font-size="13.5" fill="#475569">Descripción escrita en lenguaje</text>
  <text x="66" y="784" font-size="13.5" fill="#475569">de negocio. Sirve de recordatorio</text>
  <text x="66" y="806" font-size="13.5" fill="#475569">del requerimiento y ayuda a</text>
  <text x="66" y="828" font-size="13.5" fill="#475569">priorizar en la planificación.</text>
  <text x="66" y="856" font-size="12.5" font-weight="700" fill="#0d9488">Es el QUÉ</text>

  <rect x="351" y="686" width="298" height="188" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="351" y="686" width="298" height="46" rx="12" fill="#7c3aed"/>
  <rect x="351" y="714" width="298" height="18" fill="#7c3aed"/>
  <text x="500" y="716" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">CONVERSACIÓN</text>
  <text x="377" y="762" font-size="13.5" fill="#475569">El diálogo que aclara detalles y</text>
  <text x="377" y="784" font-size="13.5" fill="#475569">dudas sobre la historia.</text>
  <text x="377" y="812" font-size="13.5" font-weight="700" fill="#5b21b6">Es la parte más importante:</text>
  <text x="377" y="834" font-size="13.5" fill="#475569">la tarjeta sola no alcanza.</text>
  <text x="377" y="860" font-size="12.5" font-weight="700" fill="#7c3aed">Es el POR QUÉ</text>

  <rect x="662" y="686" width="298" height="188" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="662" y="686" width="298" height="46" rx="12" fill="#ea580c"/>
  <rect x="662" y="714" width="298" height="18" fill="#ea580c"/>
  <text x="811" y="716" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1">CONFIRMACIÓN</text>
  <text x="688" y="762" font-size="13.5" fill="#475569">Las pruebas que permiten decir</text>
  <text x="688" y="784" font-size="13.5" fill="#475569">que la historia se completó con</text>
  <text x="688" y="806" font-size="13.5" fill="#475569">éxito. Es la descripción breve</text>
  <text x="688" y="828" font-size="13.5" fill="#475569">de "hecho".</text>
  <text x="688" y="856" font-size="12.5" font-weight="700" fill="#ea580c">Es el CÓMO SE VERIFICA</text>

  <!-- 3. FORMATO -->
  <circle cx="58" cy="932" r="15" fill="#0d9488"/>
  <text x="58" y="938" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">3</text>
  <text x="86" y="939" font-size="24" font-weight="800" fill="#0f172a">El formato de una historia</text>

  <rect x="40" y="960" width="920" height="88" rx="12" fill="#0f172a"/>
  <text x="500" y="1000" text-anchor="middle" font-size="22" font-weight="700" fill="#5eead4">Como [QUIÉN]  ·  quiero [QUÉ]  ·  para [POR QUÉ]</text>
  <text x="500" y="1028" text-anchor="middle" font-size="14" fill="#94a3b8">El rol que la necesita, la funcionalidad que pide y el beneficio que obtiene</text>

  <!-- 4. EJEMPLO TUTORIA -->
  <rect x="0" y="1086" width="1000" height="56" fill="#0d9488"/>
  <text x="500" y="1122" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">APLICADO A ESTUD-IA</text>

  <circle cx="58" cy="1198" r="15" fill="#0d9488"/>
  <text x="58" y="1204" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">4</text>
  <text x="86" y="1205" font-size="24" font-weight="800" fill="#0f172a">Una historia real del backlog</text>

  <rect x="40" y="1226" width="920" height="344" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>

  <rect x="40" y="1226" width="920" height="56" rx="14" fill="#f0fdfa"/>
  <rect x="40" y="1268" width="920" height="14" fill="#f0fdfa"/>
  <line x1="40" y1="1282" x2="960" y2="1282" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="66" y="1262" font-size="15" font-weight="800" fill="#0f766e">HU-05 · Realizar consultas al Tutor IA</text>
  <text x="934" y="1262" text-anchor="end" font-size="13.5" font-weight="700" fill="#0f766e">ÉPICA-06: Tutor IA</text>

  <text x="66" y="1320" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1">TARJETA</text>
  <text x="66" y="1352" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#0d9488">Como</tspan> estudiante de secundaria,</text>
  <text x="66" y="1378" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#0d9488">quiero</tspan> consultar mis dudas al Tutor IA en cualquier momento,</text>
  <text x="66" y="1404" font-size="16" fill="#1e293b"><tspan font-weight="700" fill="#0d9488">para</tspan> no quedarme trabado esperando a la siguiente clase.</text>

  <line x1="66" y1="1428" x2="934" y2="1428" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="66" y="1456" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1">CONFIRMACIÓN · CRITERIOS DE ACEPTACIÓN</text>

  <circle cx="74" cy="1482" r="4" fill="#ea580c"/>
  <text x="90" y="1487" font-size="14" fill="#334155"><tspan font-weight="700">Dado</tspan> que el estudiante inició sesión, <tspan font-weight="700">cuando</tspan> escribe una duda, <tspan font-weight="700">entonces</tspan> recibe una respuesta del tutor.</text>

  <circle cx="74" cy="1512" r="4" fill="#ea580c"/>
  <text x="90" y="1517" font-size="14" fill="#334155"><tspan font-weight="700">Dado</tspan> que el modelo no responde, <tspan font-weight="700">cuando</tspan> falla la consulta, <tspan font-weight="700">entonces</tspan> se muestra un mensaje de error.</text>

  <circle cx="74" cy="1542" r="4" fill="#ea580c"/>
  <text x="90" y="1547" font-size="14" fill="#334155"><tspan font-weight="700">Dado</tspan> el historial de la sesión, <tspan font-weight="700">cuando</tspan> el estudiante vuelve al chat, <tspan font-weight="700">entonces</tspan> ve sus mensajes previos.</text>

  <rect x="40" y="1594" width="298" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="189" y="1621" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="1">PRIORIDAD</text>
  <text x="189" y="1648" text-anchor="middle" font-size="18" font-weight="800" fill="#b91c1c">Alta</text>

  <rect x="351" y="1594" width="298" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="1621" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="1">ESTIMACIÓN</text>
  <text x="500" y="1648" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">8 puntos</text>

  <rect x="662" y="1594" width="298" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="811" y="1621" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="1">ESTADO</text>
  <text x="811" y="1648" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Pendiente</text>

  <!-- 5. ROLES -->
  <circle cx="58" cy="1720" r="15" fill="#0d9488"/>
  <text x="58" y="1726" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">5</text>
  <text x="86" y="1727" font-size="24" font-weight="800" fill="#0f172a">Quién hace qué con las historias</text>

  <rect x="40" y="1748" width="298" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="1748" width="298" height="7" rx="3" fill="#0d9488"/>
  <text x="189" y="1790" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Product Owner</text>
  <text x="189" y="1822" text-anchor="middle" font-size="13.5" fill="#475569">Escribe y prioriza las</text>
  <text x="189" y="1843" text-anchor="middle" font-size="13.5" fill="#475569">historias en el backlog,</text>
  <text x="189" y="1864" text-anchor="middle" font-size="13.5" fill="#475569">y valida que lo entregado</text>
  <text x="189" y="1885" text-anchor="middle" font-size="13.5" fill="#475569">cumpla el criterio.</text>

  <rect x="351" y="1748" width="298" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="351" y="1748" width="298" height="7" rx="3" fill="#7c3aed"/>
  <text x="500" y="1790" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Scrum Master</text>
  <text x="500" y="1822" text-anchor="middle" font-size="13.5" fill="#475569">Facilita la conversación</text>
  <text x="500" y="1843" text-anchor="middle" font-size="13.5" fill="#475569">entre el PO y el equipo, y</text>
  <text x="500" y="1864" text-anchor="middle" font-size="13.5" fill="#475569">remueve lo que impide</text>
  <text x="500" y="1885" text-anchor="middle" font-size="13.5" fill="#475569">completar la historia.</text>

  <rect x="662" y="1748" width="298" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="662" y="1748" width="298" height="7" rx="3" fill="#ea580c"/>
  <text x="811" y="1790" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Development Team</text>
  <text x="811" y="1822" text-anchor="middle" font-size="13.5" fill="#475569">Estima el esfuerzo,</text>
  <text x="811" y="1843" text-anchor="middle" font-size="13.5" fill="#475569">descompone la historia</text>
  <text x="811" y="1864" text-anchor="middle" font-size="13.5" fill="#475569">en tareas técnicas y la</text>
  <text x="811" y="1885" text-anchor="middle" font-size="13.5" fill="#475569">convierte en incremento.</text>

  <!-- CIERRE -->
  <rect x="40" y="1938" width="920" height="94" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="64" y="1972" font-size="15" font-weight="800" fill="#0f766e">La idea que sostiene todo lo demás</text>
  <text x="64" y="2000" font-size="14.5" fill="#134e4a">En Scrum la conversación pesa más que el documento. Una historia de usuario no busca especificarlo todo por</text>
  <text x="64" y="2021" font-size="14.5" fill="#134e4a">escrito: busca asegurar que el equipo y el usuario entiendan lo mismo antes de construir.</text>

  <!-- PIE -->
  <rect x="0" y="2094" width="1000" height="86" fill="#0f172a"/>
  <text x="500" y="2128" text-anchor="middle" font-size="14" fill="#94a3b8">ESTUD-IA · Grupo 6 · Sección 31738</text>
  <text x="500" y="2154" text-anchor="middle" font-size="14" fill="#64748b">Curso Integrador II: Software — Universidad Tecnológica del Perú</text>
</svg>
